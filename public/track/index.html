<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Engineer Journey Tracker</title>
    <meta name="description" content="Track your 6-month journey to becoming a Machine Learning Engineer">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="bg-orbs">
        <div class="orb orb-1"></div>
        <div class="orb orb-2"></div>
        <div class="orb orb-3"></div>
    </div>

    <header id="main-header">
        <div class="header-content">
            <div class="logo">
                <span class="logo-icon">🧠</span>
                <div>
                    <h1>ML Engineer Journey</h1>
                    <p class="subtitle">6-Month Roadmap Tracker</p>
                </div>
            </div>
            <div class="header-stats">
                <div class="stat-pill" id="days-remaining-pill">
                    <span class="stat-icon">⏳</span>
                    <span id="days-remaining">183</span> days left
                </div>
                <div class="stat-pill" id="completion-pill">
                    <span class="stat-icon">🎯</span>
                    <span id="overall-pct">0</span>% complete
                </div>
            </div>
        </div>
        <div class="overall-progress-bar">
            <div class="overall-progress-fill" id="overall-fill" style="width:0%"></div>
        </div>
    </header>

    <main>
        <section class="timeline-nav" id="timeline-nav">
            <!-- Generated by JS -->
        </section>

        <section class="phases-container" id="phases-container">
            <!-- Generated by JS -->
        </section>

        <section class="projects-section glass-card" id="projects-section">
            <div class="section-header">
                <h2><span class="section-icon">🚀</span> Production Projects <span class="badge" id="projects-count">0/6</span></h2>
                <button class="btn-add" id="add-project-btn" title="Add Project">+ Add Project</button>
            </div>
            <div class="projects-grid" id="projects-grid">
                <!-- Generated by JS -->
            </div>
        </section>
    </main>

    <footer>
        <p>Built with 💜 for your ML journey &bull; Data saved locally in your browser</p>
    </footer>

    <div class="modal-overlay" id="modal-overlay">
        <div class="modal glass-card" id="modal">
            <button class="modal-close" id="modal-close">&times;</button>
            <div id="modal-content"></div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
